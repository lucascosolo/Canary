[project]
name = "canary"
version = "0.1.0"
description = "Evidence-first early-warning and historical-pattern monitor"
readme = "docs/README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "sqlalchemy>=2.1",
]

[project.optional-dependencies]
# V-Dem ships as an R data file. Parsing peaks near 2 GB, so this runs on the PC, never the VPS.
heavy = ["pandas>=2.3", "pyreadr>=0.5"]

[project.scripts]
canary = "canary.cli:main"

[dependency-groups]
dev = ["canary[heavy]", "pytest>=8.4", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--junitxml=reports/junit.xml -ra"
markers = ["db: needs a real PostgreSQL; see tests/conftest.py"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
